name: Build X1pro OpenWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'OpenWrt 版本 tag'
        default: 'v25.12.6'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget curl libelf-dev zstd ccache
          df -h

      - name: 拉取 OpenWrt 源码
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt
          echo "===== 可用 25.12 版本 ====="; git tag | grep 25.12 || true
          git checkout ${{ github.event.inputs.tag }}

      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: x1pro-${{ github.event.inputs.tag }}-${{ github.run_id }}
          restore-keys: |
            x1pro-${{ github.event.inputs.tag }}-

      - name: 设置 ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/openwrt/.ccache" >> $GITHUB_ENV
          mkdir -p openwrt/.ccache openwrt/dl
          ccache -d openwrt/.ccache -M 6G
          ccache -d openwrt/.ccache -s || true
          du -sh openwrt/dl openwrt/.ccache || true

      - name: 打补丁、加第三方源
        run: |
          chmod +x diy.sh
          cd openwrt && bash ../diy.sh

      - name: 生成配置
        run: |
          cp -r files openwrt/
          chmod +x openwrt/files/etc/uci-defaults/99-x1pro
          cp x1pro.config openwrt/.config
          cd openwrt
          make defconfig
          echo "===== 内核版本（Honk 需 ≥6.12）====="
          grep KERNEL_PATCHVER target/linux/mediatek/Makefile
          echo "===== BTF / ccache ====="
          grep -E "KERNEL_DEBUG_INFO_BTF|ALLOW_BTF_MISMATCH|CONFIG_CCACHE" .config
          echo "===== 插件检查 ====="
          for p in luci-app-passwall luci-app-nikki luci-app-mosdns \
                   luci-app-adguardhome luci-app-store luci-app-zerotier luci-app-vlmcsd \
                   luci-app-dockerman luci-app-turboacc luci-app-mwan3 luci-app-tailscale \
                   tailscale luci-theme-argon kmod-sched-bpf; do
            grep -q "CONFIG_PACKAGE_$p=y" .config && echo "OK   $p" || echo "缺失 $p"
          done

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          ccache -s || true

      - name: 保存缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: x1pro-${{ github.event.inputs.tag }}-${{ github.run_id }}

      - name: 整理产物
        if: always()
        run: |
          mkdir -p out
          cp -r openwrt/bin/targets/mediatek/filogic/* out/ 2>/dev/null || true
          cp openwrt/.config out/x1pro-final.config 2>/dev/null || true

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X1pro-OpenWrt-${{ github.event.inputs.tag }}
          path: out/
