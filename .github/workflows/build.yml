name: Build X1pro OpenWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'OpenWrt 版本 tag'
        default: 'v25.12.6'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 拉取本仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget curl libelf-dev zstd ccache

      - name: 拉取 OpenWrt 源码
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          cd openwrt && git checkout ${{ github.event.inputs.tag }}

      - name: 恢复缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: x1pro-lite-${{ github.event.inputs.tag }}-${{ github.run_id }}
          restore-keys: |
            x1pro-lite-${{ github.event.inputs.tag }}-

      - name: 设置 ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/openwrt/.ccache" >> $GITHUB_ENV
          mkdir -p openwrt/.ccache openwrt/dl
          ccache -d openwrt/.ccache -M 5G

      - name: 打补丁
        run: cd openwrt && bash ../diy.sh

      - name: 生成配置
        run: |
          cp -r files openwrt/
          chmod +x openwrt/files/etc/uci-defaults/99-x1pro
          cp x1pro.config openwrt/.config
          cd openwrt && make defconfig
          echo "===== 内核版本 ====="; grep KERNEL_PATCHVER target/linux/mediatek/Makefile
          echo "===== 检查 ====="
          for p in luci-theme-argon luci-app-samba4 luci-app-upnp luci-app-ttyd luci-app-wol \
                   luci-app-mwan3 kmod-sched-bpf kmod-nft-tproxy kmod-tun \
                   dnsmasq-full kmod-nf-conntrack-netlink kmod-zram zram-swap \
                   kmod-nft-queue kmod-tcp-bbr; do
            grep -q "CONFIG_PACKAGE_$p=y" .config && echo "OK   $p" || echo "缺失 $p"
          done
          grep -q "CONFIG_PACKAGE_dnsmasq=y" .config && echo "!! 普通 dnsmasq 还在，会和 full 冲突" || echo "OK   已去掉普通 dnsmasq"
          grep -E "KERNEL_DEBUG_INFO_BTF=" .config || echo "!! BTF 未开启"

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: 编译
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          ls -lh bin/targets/mediatek/filogic/*sysupgrade* || { echo "!! 没有生成固件"; exit 1; }

      - name: 保存缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: x1pro-lite-${{ github.event.inputs.tag }}-${{ github.run_id }}

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X1pro-OpenWrt-${{ github.event.inputs.tag }}
          include-hidden-files: true
          path: |
            openwrt/bin/targets/mediatek/filogic/*
            openwrt/.config
